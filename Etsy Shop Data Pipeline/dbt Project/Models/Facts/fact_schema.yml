version: 2

models:
  - name: fact_orders
    description: "Fact table merging receipts and fulfillments"

    columns:
      - name: receipt_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: ordered_timestamp
        tests:
          - not_null

      - name: grandtotal
        tests:
          - not_null
