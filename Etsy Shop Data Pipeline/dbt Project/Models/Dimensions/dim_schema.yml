version: 2

models:
  - name: dim_customers
    description: "Customer dimension table derived from receipts"

    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Products that were sold (derived from transactions)"

    columns:
      - name: product_id
        tests:
          - not_null
          - unique
